{% extends 'base.html' %}
{% block title %}Halls{% endblock %}
{% block content %}
<h2 class="mb-4">Available Halls</h2>
<div class="row">
    {% for hall in halls %}
    <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title">{{ hall.name }}</h4>
                <p class="card-text">Capacity: {{ hall.capacity }} people</p>
                <p class="card-text">Total slots: {{ hall.slots|length }}</p>
                <a href="{{ url_for('hall_detail', hall_id=hall.id) }}" class="btn btn-primary">View Slots</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
